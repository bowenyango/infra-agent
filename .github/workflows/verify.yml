name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - agent-1

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification gate
        run: npm run verify

      - name: Check package contents
        run: npm pack --dry-run --json
